[project]
name = "fraud-detection"
version = "1.0.0"
description = "Payment-gateway fraud detection: classical ML model, scoring API, analyst console and drift monitoring"
requires-python = ">=3.10"

[tool.black]
line-length = 120
target-version = ['py310']
extend-exclude = '''
/(
    \.git
    | \.venv
    | frontend
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"
